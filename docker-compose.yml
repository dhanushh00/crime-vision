services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crimevision-api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crimevision-frontend
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
